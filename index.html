<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update `class="theme-auto"` with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Alejandro Sosa Welford</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Alejandro Sosa Welford - Music links">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <link rel="canonical" href="https://asosawelford.github.io">

    <!-- Author Information -->
    <meta name="author" content="Alejandro Sosa Welford">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->
    <meta property="og:type" content="profile">
    <meta property="og:title" content="Alejandro Sosa Welford">
    <meta property="og:description" content="Music links">
    <meta property="og:url" content="https://asosawelford.github.io">
    <meta property="og:image" content="https://asosawelford.github.io/images/avatar@2x.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:creator" content="@asosawelford">

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
    <link rel="stylesheet" href="css/albums.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--soft" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Alejandro Sosa Welford" width="128" height="128" fetchpriority="high">

            <!-- Replace with your name or brand -->
            <h1>Alejandro Sosa Welford</h1>

            <!-- Album Cards -->
            <div class="album-grid">

              <!-- Tabaquería Album -->
              <div class="album-card" data-album-id="tabaqueria">
                <img class="album-cover" src="images/avatar@2x.png" alt="Tabaquería Album Cover">
                <div class="album-info">
                  <h2 class="album-title">Tabaquería</h2>
                  <p class="album-subtitle">Album</p>
                </div>
              </div>

            </div>

            <!-- Social Media Icons -->
            <div class="social-icons">
              <a href="https://www.instagram.com/asosawelford/" target="_blank" rel="noopener" class="social-icon" aria-label="Instagram">
                <img src="images/icons/instagram.svg" alt="Instagram">
              </a>
              <a href="https://open.spotify.com/artist/7xU9puUglICOIdpGAvM0WK" target="_blank" rel="noopener" class="social-icon" aria-label="Spotify">
                <img src="images/icons/spotify.svg" alt="Spotify">
              </a>
              <a href="https://music.youtube.com/channel/UCyZBXU_UN6xXUMEt5L4bKYQ" target="_blank" rel="noopener" class="social-icon" aria-label="YouTube Music">
                <img src="images/icons/youtube-music.svg" alt="YouTube Music">
              </a>
            </div>

      </main>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        bs as, argentina
      </footer>

    </div>
  </div>

  <!-- Album Modal: Tabaquería -->
  <div id="album-modal-tabaqueria" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 class="modal-title">Tabaquería</h2>
          <p class="modal-subtitle">Album</p>
        </div>
        <button class="modal-close" data-album-id="tabaqueria" aria-label="Close modal">×</button>
      </div>
      <div class="modal-body">
        <!-- Spotify Embed -->
        <div class="spotify-embed-container">
          <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/album/0wa1E8kpS4EkZ8vU3LeI79?utm_source=generator&si=cdd7e062a7574df1" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>

        <!-- Platform Links -->
        <h3 style="margin-bottom: 1rem; font-size: 1rem; opacity: 0.7;">Listen on</h3>
        <div class="platform-links">
          <a href="https://open.spotify.com/album/0wa1E8kpS4EkZ8vU3LeI79" target="_blank" rel="noopener" class="platform-link">
            <img class="platform-icon" src="images/icons/spotify.svg" alt="Spotify">
            <span class="platform-name">Spotify</span>
            <span class="platform-arrow">→</span>
          </a>
          <a href="https://music.apple.com/ar/artist/alejandro-sosa-welford/1533604514" target="_blank" rel="noopener" class="platform-link">
            <img class="platform-icon" src="images/icons/apple-music.svg" alt="Apple Music">
            <span class="platform-name">Apple Music</span>
            <span class="platform-arrow">→</span>
          </a>
          <a href="https://music.youtube.com/channel/UCyZBXU_UN6xXUMEt5L4bKYQ" target="_blank" rel="noopener" class="platform-link">
            <img class="platform-icon" src="images/icons/youtube-music.svg" alt="YouTube Music">
            <span class="platform-name">YouTube Music</span>
            <span class="platform-arrow">→</span>
          </a>
          <a href="https://tidal.com/artist/alejandro-sosa-welford/21506702" target="_blank" rel="noopener" class="platform-link">
            <img class="platform-icon" src="images/icons/tidal.svg" alt="Tidal">
            <span class="platform-name">Tidal</span>
            <span class="platform-arrow">→</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/albums.js"></script>

</body>

</html>
